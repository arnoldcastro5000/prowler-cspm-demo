name: Python Lint

on:
  push:
    branches: [main]
    paths:
      - 'ingest/**'
  pull_request:
    paths:
      - 'ingest/**'

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - run: pip install ruff bandit

      - name: Lint
        run: ruff check ingest/

      - name: Security scan
        run: bandit -r ingest/ -ll
