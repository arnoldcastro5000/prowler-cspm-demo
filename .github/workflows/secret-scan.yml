name: Secret Scan

on:
  push:
  pull_request:

permissions: {}

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        env:
          BL_VERSION: "1.4.0"
        run: |
          curl -fsSL -o betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}/betterleaks_${BL_VERSION}_linux_x64.tar.gz"
          echo "$(curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}/checksums.txt" \
            | grep linux_x64.tar.gz | awk '{print $1}')  betterleaks.tar.gz" | sha256sum --check
          tar -xzf betterleaks.tar.gz betterleaks
          sudo mv betterleaks /usr/local/bin/

      - name: Scan for secrets
        run: betterleaks git "$GITHUB_WORKSPACE" -v
